<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Welcome Back Screen</title>
<!-- Tailwind CSS v3 CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-animations">
    /* Subtle float animation for the spheres to mimic the 3D aesthetic */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
    .animate-float-delayed {
      animation: float 5s ease-in-out infinite;
      animation-delay: 1s;
    }
  </style>
<style data-purpose="background-styles">
    /* Custom background gradient and fluid shapes */
    .bg-fluid-custom {
      background: linear-gradient(180deg, #6085FF 0%, #2D4EB4 50%, #0D1B4D 100%);
      overflow: hidden;
      position: relative;
    }
    
    /* Creating the abstract wave/fluid shapes using pseudo-elements */
    .fluid-shape-1 {
      position: absolute;
      top: -5%;
      right: -10%;
      width: 120%;
      height: 60%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      transform: rotate(-15deg);
    }

    .fluid-shape-2 {
      position: absolute;
      top: 30%;
      left: -20%;
      width: 130%;
      height: 50%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50% 50% 20% 80% / 30% 40% 70% 60%;
      transform: rotate(10deg);
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Mimicking a mobile screen viewport -->
<main class="relative w-[375px] h-[812px] bg-fluid-custom rounded-[40px] shadow-2xl overflow-hidden font-sans text-white border-8 border-black">
<!-- BEGIN: AbstractDecorations -->
<!-- These elements recreate the fluid and spherical 3D elements from the reference image -->
<div class="fluid-shape-1" data-purpose="background-fluid-top"></div>
<div class="fluid-shape-2" data-purpose="background-fluid-middle"></div>
<!-- Top Dark Sphere -->
<div class="absolute top-10 left-10 w-24 h-24 rounded-full bg-gradient-to-br from-[#1E293B] to-[#0F172A] shadow-2xl opacity-80 animate-float" data-purpose="3d-sphere-top"></div>
<!-- Light Sphere Middle -->
<div class="absolute top-48 right-12 w-20 h-20 rounded-full bg-gradient-to-br from-blue-100 to-blue-300 shadow-lg opacity-90 animate-float-delayed" data-purpose="3d-sphere-middle"></div>
<!-- Bottom Left Small Sphere -->
<div class="absolute bottom-48 left-8 w-12 h-12 rounded-full bg-gradient-to-br from-blue-200 to-blue-400 shadow-md animate-float" data-purpose="3d-sphere-bottom-small"></div>
<!-- Bottom Large Sphere -->
<div class="absolute bottom-20 left-16 w-32 h-32 rounded-full bg-gradient-to-br from-[#1E3A8A] to-[#1e1b4b] shadow-2xl animate-float-delayed" data-purpose="3d-sphere-bottom-large"></div>
<!-- END: AbstractDecorations -->
<!-- BEGIN: ContentArea -->
<section class="relative z-10 flex flex-col justify-center h-full px-10 pt-20" data-purpose="main-content">
<div class="mb-auto">
<!-- Title Text -->
<h1 class="text-4xl font-bold mb-4 tracking-tight" data-purpose="welcome-title">
          Welcome Back!
        </h1>
<!-- Subtitle/Description -->
<p class="text-lg opacity-90 leading-relaxed max-w-[240px]" data-purpose="welcome-subtitle">
          Enter personal details to you employee account
        </p>
</div>
</section>
<!-- END: ContentArea -->
<!-- BEGIN: NavigationFooter -->
<!-- Bottom navigation buttons styled like the reference -->
<footer class="absolute bottom-0 left-0 w-full flex h-24 items-center" data-purpose="bottom-navigation">
<!-- Sign In Option -->
<button class="flex-1 h-full flex items-center justify-center text-lg font-semibold hover:bg-white/10 transition-colors" data-purpose="signin-button">
        Sign in
      </button>
<!-- Sign Up Button Container -->
<div class="flex-1 h-full bg-white rounded-tl-[40px] flex items-center justify-center" data-purpose="signup-button-container">
<button class="text-[#2D4EB4] text-lg font-bold">
          Sign up
        </button>
</div>
</footer>
<!-- END: NavigationFooter -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
