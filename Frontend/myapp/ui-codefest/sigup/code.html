<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Get Started - Registration</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for modern look -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="custom-layout">
    /* Custom background gradient and shape for the top section */
    .hero-bg {
      background: linear-gradient(135deg, #4A6CF7 0%, #1a2a6c 100%);
      position: relative;
      overflow: hidden;
    }
    /* Abstract bubble shapes to mimic the reference image */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(10px);
    }
    .bubble-1 { width: 150px; height: 150px; top: -30px; right: -20px; background: rgba(100, 140, 255, 0.3); }
    .bubble-2 { width: 100px; height: 100px; bottom: 20px; left: -10px; background: rgba(255, 255, 255, 0.2); }
    
    /* Smooth card rounding for the mobile feel */
    .content-card {
      border-top-left-radius: 2.5rem;
      border-top-right-radius: 2.5rem;
      margin-top: -3rem; /* Overlap with the header */
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Mimicking a mobile screen viewport -->
<main class="relative w-full max-w-[375px] h-[812px] bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col border-[8px] border-gray-900">
<!-- BEGIN: TopSection -->
<section class="hero-bg h-1/3 w-full flex flex-col p-6" data-purpose="header-background">
<div class="bubble bubble-1"></div>
<div class="bubble bubble-2"></div>
<!-- Back Button -->
<button aria-label="Go back" class="relative z-10 flex items-center text-white text-sm font-medium focus:outline-none">
<svg class="h-5 w-5 mr-1" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
        Back
      </button>
</section>
<!-- END: TopSection -->
<!-- BEGIN: RegistrationForm -->
<section class="content-card relative z-20 bg-white flex-grow px-8 pt-10 pb-6 flex flex-col shadow-inner" data-purpose="registration-card">
<h1 class="text-2xl font-bold text-center text-indigo-900 mb-8">Get Started</h1>
<form action="#" class="space-y-5" method="POST">
<!-- Full Name Input -->
<div data-purpose="input-group">
<label class="block text-xs font-semibold text-gray-400 mb-1" for="full_name">Full Name</label>
<input class="w-full px-0 py-2 border-0 border-b border-gray-200 focus:ring-0 focus:border-indigo-600 transition-colors text-sm placeholder-gray-300" id="full_name" name="full_name" placeholder="Enter Full Name" type="text"/>
</div>
<!-- Email Input -->
<div data-purpose="input-group">
<label class="block text-xs font-semibold text-gray-400 mb-1" for="email">Email</label>
<input class="w-full px-0 py-2 border-0 border-b border-gray-200 focus:ring-0 focus:border-indigo-600 transition-colors text-sm placeholder-gray-300" id="email" name="email" placeholder="Enter Email" type="email"/>
</div>
<!-- Password Input -->
<div data-purpose="input-group">
<label class="block text-xs font-semibold text-gray-400 mb-1" for="password">Password</label>
<input class="w-full px-0 py-2 border-0 border-b border-gray-200 focus:ring-0 focus:border-indigo-600 transition-colors text-sm placeholder-gray-300" id="password" name="password" placeholder="Enter Password" type="password"/>
</div>
<!-- Agreement Checkbox -->
<div class="flex items-start pt-2">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" id="agreement" name="agreement" type="checkbox"/>
</div>
<div class="ml-3 text-xs">
<label class="text-gray-500" for="agreement">I agree to the processing of <span class="text-indigo-600 font-semibold cursor-pointer">Personal data</span></label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95 mt-6" type="submit">
          Sign up
        </button>
</form>
<!-- BEGIN: SocialLoginSection -->
<div class="mt-auto pt-8">
<div class="relative mb-6">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-100"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-2 bg-white text-gray-400">Sign up with</span>
</div>
</div>
<div class="flex justify-center space-x-6" data-purpose="social-icons">
<!-- Facebook Icon -->
<a class="text-blue-600 hover:opacity-80 transition-opacity" href="#">
<svg class="h-6 w-6" fill="currentColor" viewbox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path></svg>
</a>
<!-- Twitter Icon -->
<a class="text-blue-400 hover:opacity-80 transition-opacity" href="#">
<svg class="h-6 w-6" fill="currentColor" viewbox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.84 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"></path></svg>
</a>
<!-- Google Icon -->
<a class="text-red-500 hover:opacity-80 transition-opacity" href="#">
<svg class="h-6 w-6" fill="currentColor" viewbox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-2.21 5.42-7.84 5.42-4.84 0-8.79-4.01-8.79-8.94s3.95-8.94 8.79-8.94c2.75 0 4.59 1.17 5.64 2.18l2.58-2.48C19.1 1.01 16.03 0 12.48 0 5.58 0 0 5.58 0 12.48s5.58 12.48 12.48 12.48c7.2 0 12-5.06 12-12.2 0-.82-.09-1.44-.21-2.1l-11.79.14z"></path></svg>
</a>
<!-- Apple Icon -->
<a class="text-black hover:opacity-80 transition-opacity" href="#">
<svg class="h-6 w-6" fill="currentColor" viewbox="0 0 24 24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.039 2.48-4.5 2.597-4.571-1.428-2.09-3.623-2.324-4.402-2.363-2.04-.156-3.94 1.12-4.99 1.12zM15.318 4.29c.844-1.026 1.415-2.454 1.259-3.87-1.22.051-2.7 0.818-3.583 1.844-.792.909-1.48 2.363-1.298 3.74 1.364.104 2.779-.688 3.622-1.714z"></path></svg>
</a>
</div>
<p class="text-center text-xs text-gray-500 mt-8">
          Already have an account? <a class="text-indigo-600 font-bold ml-1" href="#">Sign in</a>
</p>
</div>
<!-- END: SocialLoginSection -->
</section>
<!-- END: RegistrationForm -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
